{{/* Usage: {{ partial "post-status-badge.html" . }} — status badge (emoji + label) shown near the date on a blog post page */}}
{{ $status := .Params.status }}
{{ $icon := partial "post-status-icon.html" . }}
{{ with $icon }}
  <span class="badge badge-ghost badge-sm gap-1" title="{{ i18n (printf "status_%s" $status) }}">
    <span role="img" aria-hidden="true">{{ . }}</span>
    {{ i18n (printf "status_%s" $status) }}
  </span>
{{ end }}
