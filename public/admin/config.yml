local_backend: true

backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Post"
    folder: "content/blog"
    create: true
    slug: "{{year}}/{{month}}/{{slug}}"
    media_folder: "assets/images/posts/{{year}}/{{month}}/{{slug}}"
    public_folder: "/images/posts/{{year}}/{{month}}/{{slug}}"
    nested:
      depth: 3
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Categories", name: "categories", widget: "list" }
      - { label: "Date", name: "date", widget: "datetime", default: "{{now}}" }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Cover", name: "cover", widget: "image", required: false }
      - { label: "Cover Image Credits", name: "credits", widget: "string", required: false }
      - { label: "Disclaimer", name: "disclaimer", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "photos"
    label: "Photos"
    # One album is one page bundle: content/en/photos/<date>-<slug>/index.md,
    # with its images beside it. An empty media/public folder makes Decap save
    # uploads into the bundle and store bare filenames, which is what `cover`
    # and `src` must be — the templates resolve both with .Resources.GetMatch.
    folder: "content/en/photos"
    create: true
    path: "{{slug}}/index"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Camera", name: "camera", widget: "string", required: false }
      - label: "Cover"
        name: "cover"
        widget: "image"
        required: false
        hint: "Thumbnail on /photos. Defaults to the first photo by filename."
      # Hugo's own `resources` front matter. Every image in the bundle shows in
      # the grid whether it has an entry here or not; an entry only adds a caption.
      - label: "Photo captions"
        name: "resources"
        widget: "list"
        required: false
        summary: "{{fields.src}} — {{fields.title}}"
        fields:
          - { label: "Photo", name: "src", widget: "image" }
          - { label: "Title", name: "title", widget: "string", required: false }
          - label: "Params"
            name: "params"
            widget: "object"
            required: false
            fields:
              - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "snippets"
    label: "Snippets"
    folder: "content/snippets"
    create: true
    slug: "{{slug}}"
    media_folder: "assets/images/snippets/{{slug}}"
    public_folder: "/images/snippets/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - { label: "Language", name: "language", widget: "string" }
      - { label: "Description", name: "description", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "picks"
    label: "Picks"
    folder: "content/picks"
    create: true
    slug: "{{slug}}"
    media_folder: "assets/images/picks/{{slug}}"
    public_folder: "/images/picks/{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: true }
      - label: "Medium"
        name: "medium"
        widget: "select"
        options: ["movie", "series", "music", "book", "game", "podcast", "other"]
      - { label: "Creator", name: "creator", widget: "string", required: false }
      - { label: "Year", name: "year", widget: "string", required: false }
      - {
          label: "Rating",
          name: "rating",
          widget: "select",
          options: ["★", "★★", "★★★", "★★★★", "★★★★★"],
          required: false,
        }
      - { label: "Cover", name: "cover", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }
