baseURL = "https://diogomoreira.dev/"
defaultContentLanguage = 'en'
title = "Diogo Moreira"
titleCaseStyle = "none"

[languages]
[languages.en]
disabled = false
label = 'English'
locale = 'en-US'
weight = 1
contentDir = 'content/en'
[languages.pt-br]
disabled = false
label = 'Português (Brasil)'
locale = 'pt-BR'
weight = 2
contentDir = 'content/pt-br'
[languages.pt-br.params]
[languages.pt-br.params.giscus]
lang = "pt-BR"

[params]
version = "4.11.0"
description = "My thoughts about life, software development, music and so forth."
cover = "images/default-cover.png"

[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'
[[build.cachebusters]]
source = '(postcss|tailwind)\.config\.js'
target = 'css'
[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'
[[module.mounts]]
source = "node_modules/photoswipe/dist"
target = "assets/photoswipe"
[[module.mounts]]
source = "node_modules/photoswipe-dynamic-caption-plugin/dist"
target = "assets/photoswipe"
[[module.mounts]]
source = "node_modules/photoswipe-dynamic-caption-plugin"
target = "assets/photoswipe"
files = ["/photoswipe-dynamic-caption-plugin.css"]

[markup]
[markup.highlight]
style = "github-dark" # or dracula, monokai, nord, etc.
lineNos = true
anchorLineNos = true

codeFences = true
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true # allows raw HTML in Markdown

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[outputs]
home = ["HTML"]
page = ["HTML"]
section = ["HTML", "RSS"]

[taxonomies]
tag = "tags"
category = "categories"

[[params.social]]
name = "GitHub"
url = "https://github.com/diogomoreira"
icon = "github"

[[params.social]]
name = "LinkedIn"
url = "https://linkedin.com/in/diogodmoreira"
icon = "linkedin"

[[params.social]]
name = "Mastodon"
handle = "@diogomoreira@hachyderm.io"
url = "https://hachyderm.io/@diogomoreira"
icon = "mastodon"
# Read by `mastodon-toots.html` on /now. Optional: without it the script falls
# back to /api/v1/accounts/lookup, costing one extra request per visitor. The
# host and username come from `handle`, so this is the only id to keep in sync.
accountId = "113079595846784868"

[[params.social]]
name = "Email"
url = "mailto:diogo.dmoreira@gmail.com"
icon = "email"

[[params.social]]
name = "Instagram"
url = "https://instagram.com/diogo.dmoreira"
icon = "instagram"

[params.lastfm]
username = ""
apikey = ""

[params.theaudiodb]
apikey = ""

[params.giscus]
repo = "diogomoreira/diogomoreira.dev"
repoId = "MDEwOlJlcG9zaXRvcnkzNjM3NTY5NTM="
category = "General"
categoryId = "DIC_kwDOFa59mc4CV9_B"
mapping = "pathname"
strict = "1"
reactionsEnabled = "1"
emitMetadata = "1"
inputPosition = "bottom"
lang = "en"

[pagination]
pagerSize = 5

[[menus.main]]
identifier = "about"
pageRef = "/about"
weight = 1
[menus.main.params]
icon = "user"

