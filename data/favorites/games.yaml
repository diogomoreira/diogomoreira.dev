# `display: card` — one horizontal card per game, cover on the left, because a
# collection page has the room a twelve-up poster grid never did. `cover_ratio`
# still applies to the cover column: 2:3, matching vertical box art and Steam's
# 600×900 storefront capsule; sources that aren't 2:3 are centre-cropped.
#
# Per entry, on top of the shared fields: `genre` (the kicker), `mode` and
# `platform` (the two meta items after it — read as "Single-player · Switch")
# and an optional `description`. Every one of them is optional and the card
# drops what is missing.
#
# No `date` on purpose: the order below is the order on the page, since
# favorites-categories.html keeps undated entries in file order. Adding a date
# to one entry would float it above every undated one, and take it onto the
# homepage's "recently added" row, which games are otherwise absent from.
weight: 4
display: card
cover_ratio: poster
