# No `date` on purpose: the order below is the order on the page —
# favorites-categories.html keeps undated entries in file order, and a date on
# one entry would float it above every undated one.
#
# `groups` splits the page into headed sections, in this order; each entry names
# its `group`. A heading's text is `favorites_group_<key>` in both i18n files.
# An entry with no `group` (or one not listed here) renders first, unheaded.
#
# No `link` on any entry, on purpose: where a show streams changes too often to
# keep up with, and the card degrades to an unlinked panel without one.
#
# `running: true` on an entry marks a show still airing. Inside each group the
# on-air entries render first under their own label, then the rest under theirs;
# a group with nothing on air shows no labels at all.
#
# `columns: 4` — four to a row rather than the poster grid's default auto-fill
# (~six at the full column). Show art is landscape-ish key art cropped square,
# and at six-up the faces were too small to tell apart.
weight: 7
display: poster
columns: 4
groups: [series, anime]
items:
