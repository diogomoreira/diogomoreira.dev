# `date_label: finished` renders each entry's `date` as "Finished <date>" — for a
# book, the date you added it and the date you finished it are the same thing, so
# there is no second field to keep in step with the sort key. Any category can
# opt in; leave it off and no date shows.
#
# Leave `date` off a book you are still reading: it sorts to the top of the
# section and renders a "Reading" badge in place of the date.
#
# Most of the list below came out of a Goodreads export (the `read` shelf, 2026-08).
# Entries marked "shelved date" had no Date Read there, only a Date Added, so the
# "Finished" they render is really when the book was shelved — several were added
# in one batch in Feb 2018. Correct them by hand as you remember the real dates —
# don't just drop `date`, which now means "still reading".
